name: Deploy ScoutForge to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: scoutforge-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify real ESCO dataset is included
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('web/data/esco.json')
          assert p.is_file(), 'Verified ESCO snapshot missing'
          d=json.loads(p.read_text())
          assert d['source']=='European Commission ESCO'
          assert d['counts']['occupations']>=100
          assert d['counts']['relations']>=100
          print('Verified source:',d['version'],d['counts'])
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
