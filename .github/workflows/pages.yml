name: Deploy ScoutForge to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: scoutforge-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real ESCO dataset is included
        run: |
          python3 - <<'PYI'
          import json
          from pathlib import Path
          p=Path('web/data/esco.json')
          assert p.is_file(), 'Verified ESCO snapshot missing'
          d=json.loads(p.read_text())
          assert d['source']=='European Commission ESCO'
          assert d['counts']['occupations']>=100
          assert d['counts']['relations']>=100
          print('Verified source:',d['version'],d['counts'])
          PYI
      - name: Prepare versioned HTML/CSS/JavaScript release
        run: python scripts/build_site.py
      - name: Verify fictional SQLite/JSON talent sandbox
        run: |
          python - <<'PY'
          import json,sqlite3
          d=json.load(open('_site/data/talent-sandbox.json'))
          assert d['kind']=='synthetic_talent_sandbox'
          assert d['counts']['profiles']>1000
          with sqlite3.connect('_site/data/talent-sandbox.sqlite') as db:
            assert db.execute('select count(*) from profiles').fetchone()[0]==d['counts']['profiles']
          print('Verified fictional data:',d['counts'])
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment