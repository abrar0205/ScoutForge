name: ScoutForge CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check browser modules
        run: npm run check
      - name: Engine, Boolean, outreach, AI adapter, ATS and workbook tests (+ benchmark guard)
        run: npm test
      - name: Benchmark report
        run: node eval/run.mjs
      - name: Build scripts and ESCO index tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build cache-safe release
        run: python scripts/build_site.py

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build release
        run: python scripts/build_site.py
      - name: End-to-end flows at 1440px and 390px
        run: SCOUTFORGE_SITE_ROOT=_site SCOUTFORGE_ARTIFACTS=e2e-artifacts python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: e2e-artifacts
          retention-days: 7
